[project]
name = "portmux"
version = "0.1.0"
description = "A TCP port forwarding tunnel that multiplexes many logical streams over a single control connection using a strictly binary protocol."
readme = "README.md"
authors = [
    { name = "Shabanov Anton", email = "iamshabanov@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
]

[project.scripts]
portmux = "portmux:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
